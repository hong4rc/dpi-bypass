name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build all targets
        env:
          CGO_ENABLED: "0"
        run: |
          v=${GITHUB_REF_NAME}
          mkdir dist
          build() { # os arch outfile extra-ldflags
            GOOS=$1 GOARCH=$2 go build -ldflags "$4 -s -w -X main.version=$v" -o "dist/$3" ./cmd/dpi-bypass
          }
          build windows amd64 dpi-bypass-windows-amd64.exe "-H=windowsgui"
          build darwin  amd64 dpi-bypass-macos-intel ""
          build darwin  arm64 dpi-bypass-macos-apple-silicon ""
          build linux   amd64 dpi-bypass-linux-amd64 ""
          cd dist && sha256sum * > SHA256SUMS.txt
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Windows build has a tray icon (no console). macOS and Linux builds run in a terminal and are experimental. See the README."
