name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: test
        run: go test ./...

      - name: build and package
        env:
          CGO_ENABLED: "0"
        run: |
          v=${GITHUB_REF_NAME}
          mkdir -p dist work
          # The Windows exe is self-contained (web pages are embedded, no DLLs to install),
          # so it is published as the bare .exe.
          GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui -s -w -X main.version=$v" \
            -o dist/dpi-bypass-windows-amd64.exe ./cmd/dpi-bypass
          # macOS and Linux binaries are published as .tar.gz: a plain download loses the
          # executable bit, an archive keeps it. Each holds the binary and the README.
          pack() { # os arch name
            d=work/$3; mkdir -p "$d"
            GOOS=$1 GOARCH=$2 go build -ldflags "-s -w -X main.version=$v" -o "$d/dpi-bypass" ./cmd/dpi-bypass
            cp README.md "$d/"
            chmod 755 "$d/dpi-bypass"
            tar -C work -czf "dist/$3.tar.gz" "$3"
          }
          pack darwin arm64 dpi-bypass-macos-apple-silicon
          pack darwin amd64 dpi-bypass-macos-intel
          pack linux  amd64 dpi-bypass-linux-amd64
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: archives keep the executable bit
        run: |
          for f in dist/*.tar.gz; do
            tar -tvzf "$f" | grep -E '^-rwx.* dpi-bypass-[a-z0-9-]+/dpi-bypass$' >/dev/null \
              || { echo "missing executable bit in $f"; exit 1; }
          done

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Windows: download the .exe and double-click it (a tray icon appears; Windows may warn because the file is not code-signed: More info > Run anyway). macOS and Linux: extract the .tar.gz and run ./dpi-bypass in a terminal (experimental; on macOS you may need: xattr -d com.apple.quarantine dpi-bypass). See the README."
