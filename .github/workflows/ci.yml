name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go build -ldflags "-H=windowsgui" -o dpi.exe ./cmd/dpi-bypass
      - uses: actions/upload-artifact@v4
        with:
          name: dpi-windows
          path: dpi.exe

  # macOS is built on a macOS runner with CGO: the menu bar icon is Cocoa code.
  cross-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: macos-latest, target: darwin/amd64, cgo: "1"}
          - {os: macos-latest, target: darwin/arm64, cgo: "1"}
          - {os: ubuntu-latest, target: linux/amd64, cgo: "0"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build ${{ matrix.target }}
        run: |
          export GOOS=${MATRIX_TARGET%/*} GOARCH=${MATRIX_TARGET#*/} CGO_ENABLED=$MATRIX_CGO
          go vet ./...
          go build -o /dev/null ./cmd/dpi-bypass
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_CGO: ${{ matrix.cgo }}
